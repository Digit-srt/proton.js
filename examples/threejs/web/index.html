<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Proton.js · Three.js</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 28px clamp(16px, 5vw, 56px);
      background: #0d1119; color: #edf3f5;
      font: 15px/1.55 "Segoe UI", system-ui, sans-serif;
    }
    main { margin: auto; max-width: 1040px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    h1 { margin: 0; font-size: clamp(29px, 5vw, 47px); letter-spacing: -.06em; }
    header p { margin: 2px 0 0; color: #a2afbb; }
    button {
      padding: 9px 14px; border: 1px solid #4b5f4b; border-radius: 7px;
      background: #1b291d; color: #bbfa77; font: inherit; text-align: center;
    }
    button:focus-visible { outline: 2px solid #bbfa77; outline-offset: 3px; }
    button:disabled { opacity: .55; }
    #stage {
      position: relative; margin-top: 20px; min-height: 250px; height: min(66vh, 660px);
      overflow: hidden; border: 1px solid #273343; border-radius: 14px; background: #101725;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #status { min-height: 1.6em; color: #a2afbb; }
    #status[data-state="error"] { color: #ffba97; }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Three.js scene</h1>
        <p>Proton.js · Servo · WebGL 2</p>
      </div>
      <button type="button" id="toggle" disabled>Pause</button>
    </header>
    <div id="stage">
      <canvas id="view" aria-label="Rotating 3D knot with orbit rings"></canvas>
    </div>
    <p role="status" id="status">Loading scene…</p>
  </main>
  <script defer src="./scene.bundle.js"></script>
</body>
</html>
